<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size Chart | Perking Fulfillment</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #111418;
    --muted: #6b7280;
    --line: #e5e7eb;
    --head: #111418;
    --head-ink: #ffffff;
    --stripe: #f8f9fb;
    --accent: #c8102e;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }

  header { text-align: center; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .controls {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
  }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  select {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    background: #fff;
    color: var(--ink);
  }
  select:focus { outline: 2px solid var(--ink); outline-offset: -1px; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; height: 42px; }
  .seg button {
    border: 0; background: #fff; color: var(--ink);
    padding: 0 14px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: #fff; }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 8px 16px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .tabs button.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card h2 { margin: 0; padding: 14px 16px; font-size: 17px; border-bottom: 1px solid var(--line); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th, td { padding: 11px 12px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  thead th { background: var(--head); color: var(--head-ink); font-weight: 700; }
  thead th small { display: block; font-weight: 500; opacity: .7; font-size: 12px; }
  tbody tr:nth-child(even) td, tbody tr:nth-child(even) th { background: var(--stripe); }
  tbody th { text-align: left; font-weight: 600; }
  th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; background: inherit; }
  thead th:first-child { background: var(--head); }
  tbody th:first-child { background: var(--card); }
  tbody th small { color: var(--muted); font-weight: 400; }

  .hidden { display: none !important; }

  .notes { padding: 12px 16px; font-size: 13px; color: var(--muted); }
  .notes ul { margin: 0; padding-left: 18px; }
  .notes li.important { color: var(--accent); font-weight: 600; }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }

  @media (max-width: 720px) {
    .controls { grid-template-columns: 1fr; }
    .seg { width: 100%; }
    .seg button { flex: 1; }
    header h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SIZE CHART <span>PERKING FULFILLMENT</span></h1>
    <p>Select a league to view its size chart.</p>
  </header>

  <section class="controls">
    <div class="field">
      <label for="league">League</label>
      <select id="league"></select>
    </div>
    <div class="field" id="unitField">
      <label>Unit</label>
      <div class="seg" id="unit">
        <button type="button" data-u="in">US (inch)</button>
        <button type="button" data-u="cm">EU (cm)</button>
      </div>
    </div>
  </section>

  <nav class="tabs" id="tabs"></nav>

  <section class="card">
    <h2 id="title"></h2>
    <div class="scroll"><table id="table"></table></div>
    <div class="notes" id="notes"></div>
  </section>

</div>

<script>
/*
 * DATA — numbers are copied exactly from the supplier charts (no rounding).
 * Each chart: sizes = [{us, eu?, age?}], rows = [{name, cm:[...]} and/or {name, in:[...]}]
 * A value can be a number or a range [min, max].
 * If a row only has one unit, the other unit is converted (1 in = 2.54 cm).
 * showBoth: true  -> always show cm and inch rows (unit toggle hidden).
 * notes: the note printed under that chart (keep the supplier's note text here).
 * To add a new league: add one more entry to LEAGUES.
 */
const LEAGUES = [
  {
    id: "nfl", name: "NFL",
    charts: [
      { tab: "Men", title: "NFL Men's Size Chart",
        sizes: ["S","M","L","XL","2XL","3XL"].map(s => ({ us: s })),
        rows: [
          { name: "Chest Width", in: [21.3,22.4,23.6,24.4,25.6,27.6], cm: [54,57,60,62,65,70] },
          { name: "Length", in: [29.1,30.7,31.5,32.7,33.9,35.4], cm: [74,78,80,83,86,90] }
        ] },
      { tab: "Women", title: "NFL Women's Size Chart",
        sizes: ["S","M","L","XL","XXL"].map(s => ({ us: s })),
        rows: [
          { name: "Chest Width", in: [16.5,17.7,18.9,20.1,20.9], cm: [42,45,48,51,53] },
          { name: "Length", in: [24.8,25.6,26.8,27.6,28.3], cm: [63,65,68,70,72] }
        ] },
      { tab: "Youth", title: "NFL Youth's Size Chart",
        sizes: ["YTH S","YTH M","YTH L","YTH XL"].map(s => ({ us: s })),
        rows: [
          { name: "Chest Width", in: [16.9,18.1,19.3,20.5], cm: [43,46,49,52] },
          { name: "Length", in: [24.8,25.6,26.8,28], cm: [63,65,68,71] }
        ] }
    ]
  },
  {
    id: "nhl", name: "NHL",
    charts: [
      { tab: "Men", title: "NHL New Adidas Men's Size Chart",
        sizes: [{us:"S",eu:"46"},{us:"M",eu:"50"},{us:"L",eu:"52"},{us:"XL",eu:"54"},{us:"XXL",eu:"56"},{us:"XXXL",eu:"60"}],
        rows: [
          { name: "Length", cm: [77,79,81,83,85,87] },
          { name: "Shoulder Width", cm: [49,51,51,52,52,53] },
          { name: "1/2 Chest Circumference", cm: [56,59,62,65,68,71] },
          { name: "Sleeve Length", cm: [84,85,87,88,89,90] }
        ] },
      { tab: "Women", title: "NHL New Adidas Women's Size Chart",
        sizes: ["S","M","L","XL"].map(s => ({ us: s })),
        rows: [
          { name: "Length", cm: [74,76,78,80] },
          { name: "Shoulder Width", cm: [45,47,49,51] },
          { name: "Full Chest Circumference", cm: [90,95,100,107] },
          { name: "Sleeve Length", cm: [55,56,57,58] }
        ] },
      { tab: "Kids", title: "NHL New Adidas Kids Size Chart",
        sizes: [{us:"S/M"},{us:"L/XL"}],
        rows: [
          { name: "Length", cm: [60,67] },
          { name: "Shoulder Width", cm: [43,48] },
          { name: "Full Chest Circumference", cm: [91,101] },
          { name: "Sleeve Length", cm: [50,57] }
        ] }
    ]
  },
  {
    id: "mlb", name: "MLB",
    charts: [
      { tab: "Men", title: "Men's Baseball Jersey Sizing",
        sizes: [{us:"M",eu:"48"},{us:"L",eu:"50"},{us:"XL",eu:"52"},{us:"XXL",eu:"54"},{us:"XXXL",eu:"56"}],
        rows: [
          { name: "Chest", in: [44,"47 1/4",51,55,59], cm: [111.32,119.5425,129.03,139.15,149.27] },
          { name: "Back Length", in: [31,"31 5/8","32 1/2","33 1/4",34], cm: [78.43,80.01125,82.225,84.1225,86.02] }
        ] },
      { tab: "Women", title: "Women Baseball Sizing Chart",
        sizes: ["S","M","L","XL"].map(s => ({ us: s })),
        rows: [
          { name: "Chest", in: [[34,35],[36,37],[38,40],[41.5,43.5]] },
          { name: "Waist", in: [[26,27],[28,29],[30,32],[33.5,35.5]] },
          { name: "Hip", in: [[36.5,37.5],[38.5,39.5],[40.5,42.5],[44,46]] },
          { name: "Sleeve", in: [30,"30 3/4",31.5,32] }
        ] },
      { tab: "Youth", title: "Youth Baseball Sizing Chart",
        sizes: [{us:"S",age:"6-8"},{us:"M",age:"10-12"},{us:"L",age:"14-16"},{us:"XL",age:"16-18"}],
        rows: [
          { name: "Chest", in: [[32,33],[34,35],[36,37],[38,40]] },
          { name: "Waist", in: [[24,25],[26,27],[28,29],[30,32]] }
        ] }
    ]
  },
  {
    id: "cap", name: "Cap",
    charts: [
      { tab: "Cap", title: "Size Chart Cap",
        showBoth: true,
        sizes: ["6 7/8","7","7 1/8","7 1/4","7 3/8","7 1/2","7 5/8","7 3/4","7 7/8","8"].map(s => ({ us: s })),
        rows: [
          { name: "Circumference", cm: [54.9,55.8,56.8,57.7,58.7,59.6,60.6,61.5,63,64] }
        ],
        notes: [
          { important: true, text: "The actual production size runs 2-3 cm smaller than the standard size." },
          { important: true, text: "We recommend customers order one size up for the best fit ✨" }
        ] }
    ]
  }
];

/* Shown under a chart only when that chart has no notes of its own. */
const DEFAULT_NOTES = [
  { text: "Measurements are taken with the garment laid flat." }
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const IN = 2.54;
const state = { league: LEAGUES[0].id, tab: 0, unit: "in" };

try {
  const saved = JSON.parse(localStorage.getItem("prk-size-chart") || "{}");
  if (saved.unit === "cm" || saved.unit === "in") state.unit = saved.unit;
} catch (e) {}

/* "47 1/4" -> 47.25 (only used when converting) */
function num(v) {
  if (typeof v === "number") return v;
  const m = String(v).match(/^(\d+)\s+(\d+)\/(\d+)$/);
  return m ? +m[1] + m[2] / m[3] : +v;
}
/* converted values only: 1 decimal, trailing zero removed */
const conv = n => (Math.round(n * 10) / 10).toString();

/* returns display text; source values are shown exactly as given */
function cell(row, i, unit) {
  if (row[unit]) {
    const v = row[unit][i];
    return Array.isArray(v) ? v[0] + " – " + v[1] : String(v);
  }
  const src = row.cm ? "cm" : "in";
  const f = src === "cm" ? (x => num(x) / IN) : (x => num(x) * IN);
  const v = row[src][i];
  return Array.isArray(v) ? conv(f(v[0])) + " – " + conv(f(v[1])) : conv(f(v));
}

/* ---------- render ---------- */
function render() {
  const L = LEAGUES.find(l => l.id === state.league);
  const C = L.charts[state.tab] || L.charts[0];

  $("tabs").innerHTML = L.charts.length > 1
    ? L.charts.map((c, i) => `<button type="button" data-i="${i}" class="${i === state.tab ? "on" : ""}">${c.tab}</button>`).join("")
    : "";
  $("unitField").classList.toggle("hidden", !!C.showBoth);
  document.querySelectorAll("#unit button").forEach(b => b.classList.toggle("on", b.dataset.u === state.unit));
  $("title").textContent = C.title;

  const units = C.showBoth ? ["cm", "in"] : [state.unit];
  const hasEU = C.sizes.some(s => s.eu);

  let html = "<thead><tr><th>Size</th>";
  C.sizes.forEach(s => { html += `<th>${s.us}${s.age ? `<small>(${s.age})</small>` : ""}</th>`; });
  html += "</tr></thead><tbody>";
  if (hasEU) {
    html += `<tr><th>EU Size</th>` + C.sizes.map(s => `<td>${s.eu || "—"}</td>`).join("") + "</tr>";
  }
  C.rows.forEach(r => units.forEach(u => {
    html += `<tr><th>${r.name} <small>(${u})</small></th>`;
    C.sizes.forEach((_, i) => { html += `<td>${cell(r, i, u)}</td>`; });
    html += "</tr>";
  }));
  html += "</tbody>";
  $("table").innerHTML = html;

  const notes = C.notes && C.notes.length ? C.notes : DEFAULT_NOTES;
  $("notes").innerHTML = "<ul>" + notes.map(n => `<li class="${n.important ? "important" : ""}">${n.text}</li>`).join("") + "</ul>";
}

/* ---------- events ---------- */
$("league").innerHTML = LEAGUES.map(l => `<option value="${l.id}">${l.name}</option>`).join("");
$("league").addEventListener("change", e => { state.league = e.target.value; state.tab = 0; render(); });
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.tab = +b.dataset.i; render(); } });
$("unit").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.unit = b.dataset.u;
  try { localStorage.setItem("prk-size-chart", JSON.stringify({ unit: state.unit })); } catch (err) {}
  render();
});

render();
</script>
</body>
</html>
