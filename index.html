<title>Size Chart | Perking Fulfillment</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #111418;
    --muted: #6b7280;
    --line: #e5e7eb;
    --head: #111418;
    --head-ink: #ffffff;
    --stripe: #f8f9fb;
    --accent: #c8102e;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }

  header { text-align: center; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 28px; letter-spacing: .5px; }
  header .brand { display: block; margin-top: 2px; color: var(--accent); font-size: 14px; font-weight: 700; letter-spacing: 2px; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  .controls {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
  }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .controls .field[hidden] { display: none; }
  .controls label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  select {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    background: #fff;
    color: var(--ink);
  }
  select:focus { outline: 2px solid var(--ink); outline-offset: -1px; }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs:empty { display: none; }
  .tabs button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 8px 16px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .tabs button.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card h2 { margin: 0; padding: 14px 16px; font-size: 17px; border-bottom: 1px solid var(--line); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th, td { padding: 11px 12px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  thead th { background: var(--head); color: var(--head-ink); font-weight: 700; white-space: normal; }
  tbody tr:nth-child(even) td, tbody tr:nth-child(even) th { background: var(--stripe); }
  tbody th { text-align: left; font-weight: 600; }
  th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; background: inherit; }
  thead th:first-child { background: var(--head); }
  tbody th:first-child { background: var(--card); }
  tbody th small { color: var(--muted); font-weight: 400; }

  .notes { padding: 12px 16px; font-size: 13px; color: var(--muted); }
  .notes:empty { display: none; }
  .notes ul { margin: 0; padding-left: 18px; }
  .notes li.important { color: var(--accent); font-weight: 600; }

  @media (max-width: 720px) {
    header h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SIZE CHART</h1>
    <span class="brand">PERKING FULFILLMENT</span>
    <p>Khách hàng vui lòng chọn "SẢN PHẨM" và "THƯƠNG HIỆU" để xem bảng kích thước</p>
  </header>

  <section class="controls">
    <div class="field">
      <label for="product">Product</label>
      <select id="product"></select>
    </div>
    <div class="field" id="brandField">
      <label for="brand">Brand</label>
      <select id="brand"></select>
    </div>
  </section>

  <nav class="tabs" id="tabs"></nav>

  <section class="card">
    <h2 id="title"></h2>
    <div class="scroll"><table id="table"></table></div>
    <div class="notes" id="notes"></div>
  </section>
</div>

/* PRODUCT -> BRAND structure. brands = ids from LEAGUES above (in display order).
   A product with only one brand hides the Brand selector. */
const PRODUCTS = [
  { id: "jersey",  name: "Jersey",  brands: ["nfl","nhl","mlb","nba"] },
  { id: "hoodie",  name: "Hoodie",  brands: ["nfl-hoodie"] },
  { id: "shorts",  name: "Shorts",  brands: ["shorts"] },
  { id: "cap",     name: "Cap",     brands: ["cap"] },
  { id: "shoes",   name: "Shoes",   brands: ["adidas","asics","balenciaga","crocs","gucci","louis-vuitton","new-balance","nike","salomon","ugg"] },
  { id: "jewelry", name: "Jewelry", brands: ["jewelry"] }
];

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
const byId = id => LEAGUES.find(l => l.id === id);
const state = { product: PRODUCTS[0].id, brand: PRODUCTS[0].brands[0], tab: 0 };

function fillBrands() {
  const P = PRODUCTS.find(p => p.id === state.product);
  $("brand").innerHTML = P.brands.map(id => `<option value="${id}">${byId(id).name}</option>`).join("");
  $("brand").value = state.brand;
  $("brandField").hidden = P.brands.length < 2;
}

function render() {
  const L = byId(state.brand);
  const C = L.charts[state.tab] || L.charts[0];

  $("tabs").innerHTML = L.charts.length > 1
    ? L.charts.map((c, i) => `<button type="button" data-i="${i}" class="${i === state.tab ? "on" : ""}">${c.tab}</button>`).join("")
    : "";
  $("title").textContent = C.title;

  let html;
  if (C.columns) {
    /* grid layout: same orientation as the source image */
    html = "<thead><tr>" + C.columns.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
    C.data.forEach(row => { html += "<tr>" + row.map((v, i) => i === 0 ? `<th>${v}</th>` : `<td>${v}</td>`).join("") + "</tr>"; });
  } else {
    html = `<thead><tr><th>${C.sizeLabel || "Size"}</th>` + C.sizes.map(s => `<th>${s}</th>`).join("") + "</tr></thead><tbody>";
    C.rows.forEach(r => {
      html += `<tr><th>${r.name}${r.unit ? ` <small>(${r.unit})</small>` : ""}</th>`;
      html += r.values.map(v => `<td>${v}</td>`).join("") + "</tr>";
    });
  }
  $("table").innerHTML = html + "</tbody>";

  const notes = C.notes || [];
  $("notes").innerHTML = notes.length
    ? "<ul>" + notes.map(n => `<li class="${n.important ? "important" : ""}">${n.text}</li>`).join("") + "</ul>"
    : "";
}

$("product").innerHTML = PRODUCTS.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
$("product").addEventListener("change", e => {
  state.product = e.target.value;
  state.brand = PRODUCTS.find(p => p.id === state.product).brands[0];
  state.tab = 0; fillBrands(); render();
});
$("brand").addEventListener("change", e => { state.brand = e.target.value; state.tab = 0; render(); });
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.tab = +b.dataset.i; render(); } });

fillBrands();
render();
</script>
